[project]
name = "workplace-rights-assistant"
version = "0.1.0"
description = "RAG assistant for Australian Modern Awards, the NES and WorkSafe Victoria guidance"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "beautifulsoup4>=4.12",
    "fastembed>=0.5",  # ONNX Runtime: bge embeddings + MiniLM re-ranker without torch
    "httpx>=0.28",  # OpenAI-compatible LLM endpoint (app/llm.py)
    "langfuse>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# pytest fixtures imported from another test module look like redefinitions
"tests/*" = ["F811"]
