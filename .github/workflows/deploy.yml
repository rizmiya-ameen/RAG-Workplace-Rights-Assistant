# Deploy (build step 21): after CI passes on main, push the API image to ghcr.io, roll it out
# to Azure Container Apps, then build the web UI against the API's URL and upload it to Azure
# Static Web Apps.
#
# Azure login is OpenID Connect: GitHub proves it is this repo's main branch, Azure trusts
# that (federated credential), so no Azure password or key is stored in GitHub. One-time
# setup: deploy/azure_setup.py (creates the resources and sets the variables used below).
# Until it has run, only the image push happens.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/rizmiya-ameen/workplace-rights-api
  RESOURCE_GROUP: rg-workplace-rights
  API_APP: wra-api

jobs:
  api:
    name: API image -> Container Apps
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # OIDC login to Azure
    outputs:
      deployed: ${{ steps.rollout.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out the new image
        id: rollout
        if: vars.AZURE_CLIENT_ID != ''
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update -n "$API_APP" -g "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.event.workflow_run.head_sha || github.sha }}" \
            --query properties.latestRevisionName -o tsv

      # Scale-to-zero: this also wakes the new revision (models load in ~30-60 s).
      - name: Smoke test (/health)
        if: vars.AZURE_CLIENT_ID != ''
        run: |
          for i in $(seq 1 30); do
            curl -fs --max-time 20 "${{ vars.API_URL }}/health" && exit 0
            sleep 10
          done
          exit 1

  web:
    name: Web UI -> Static Web Apps
    needs: api
    if: needs.api.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.API_URL }}
      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
