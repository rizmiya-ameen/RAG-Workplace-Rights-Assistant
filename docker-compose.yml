# Optional: a local Postgres + pgvector for people who have Docker.
# The default dev setup uses a hosted Neon Postgres (DATABASE_URL in backend/.env) and runs the
# app natively with uv. The API's Dockerfile is built in CI/Azure, not on the dev laptop.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://wra:wra@127.0.0.1:5432/wra
services:
  db:
    image: pgvector/pgvector:pg18  # same major version as the Neon dev DB
    environment:
      POSTGRES_USER: wra
      POSTGRES_PASSWORD: wra
      POSTGRES_DB: wra
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql  # Postgres 18 images keep data under /var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wra -d wra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
